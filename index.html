```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Periodic</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #eaf4ff;
      background:
        radial-gradient(circle at 15% 15%, #12365c 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #092e45 0, transparent 35%),
        #070b16;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 35px;
      border: 1px solid #23476a;
      border-radius: 22px;
      background: rgba(13, 23, 42, 0.96);
      box-shadow: 0 20px 70px #0008;
    }

    .logo {
      color: #56c5ff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 29px;
      margin-bottom: 10px;
    }

    .description {
      color: #9eafc8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #2b405c;
      outline: none;
      background: #080f1f;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #56c5ff;
      box-shadow: 0 0 0 3px #56c5ff20;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(100deg, #4bb8ff, #80e5ff);
      color: #06111d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .note {
      color: #7f91ab;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      margin-top: 20px;
    }

    #welcome {
      display: none;
      text-align: center;
    }

    .success-icon {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 50%;
      border: 1px solid #35d6a0;
      background: #35d6a018;
      color: #53edb9;
      font-size: 38px;
    }

    #welcome h1 {
      font-size: 26px;
      color: #70e8bd;
    }

    #welcome p {
      margin-top: 15px;
      color: #a7b8ce;
      line-height: 1.7;
    }

    .progress {
      height: 5px;

      border-radius: 10px;
      overflow: hidden;

    }

    .progress-bar {
      height: 100%;
      width: 0;

    }

    .progress-bar.run {
      animation: progress 5s linear forwards;
    }

    @keyframes progress {
      to { width: 100%; }
    }

    @media (max-width: 480px) {
      .container { padding: 25px 20px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <section id="login">
      <div class="logo">PERIODIC</div>

      <h1>Chào mừng bạn</h1>
      <p class="description">
        Điền thông tin bên dưới để tiếp tục đến website học tập Periodic.
      </p>

      <form id="loginForm">
        <label for="username">Tên người dùng</label>
        <input
          id="username"
          type="text"
          maxlength="40"
          placeholder="Nhập tên của bạn"
          autocomplete="off"
          required
        >

        <label for="email">Email (không bắt buộc)</label>
        <input
          id="email"
          type="email"
          placeholder="example@email.com"
          autocomplete="off"
        >

        <button type="submit">Đăng nhập</button>
      </form>

      <p class="note">
        Trang minh họa không tạo tài khoản và không lưu thông tin của bạn.
      </p>
    </section>

    <section id="welcome" aria-live="polite">
      <div class="success-icon">✓</div>

      <div class="logo">PERIODIC</div>

      <h1>Đăng nhập thành công!</h1>

      <p id="welcomeMessage"></p>

      <p>
        Đang chuyển đến trang chính sau
        <strong id="seconds">5</strong> giây...
      </p>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

  </main>

  <script>
    const form = document.getElementById("loginForm");
    const login = document.getElementById("login");
    const welcome = document.getElementById("welcome");
    const welcomeMessage = document.getElementById("welcomeMessage");
    const secondsDisplay = document.getElementById("seconds");
    const progressBar = document.getElementById("progressBar");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();

      if (!username) return;

      // Chỉ sử dụng thông tin trong bộ nhớ tạm thời của trang.
      // Không lưu vào localStorage, sessionStorage hay máy chủ.
      login.style.display = "none";
      welcome.style.display = "block";

      welcomeMessage.textContent =
        "Xin chào " + username +
        "! Chúc bạn có trải nghiệm học tập hiệu quả cùng Periodic.";

      progressBar.classList.add("run");

      let seconds = 5;
      const timer = setInterval(function() {
        seconds--;
        secondsDisplay.textContent = seconds;

        if (seconds <= 0) {
          clearInterval(timer);

          // login.html nằm cùng cấp với thư mục preodic.website
          window.location.href = "./preodic.website/preodic.html";
        }
      }, 1000);
    });
  </script>
</body>
</html>
