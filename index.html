
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic | Đăng nhập</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #eef6ff;
            background:
                radial-gradient(circle at top left, #123b65, transparent 40%),
                radial-gradient(circle at bottom right, #063b4d, transparent 35%),
                #070b16;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border: 1px solid #234b70;
            border-radius: 22px;
            background: rgba(14, 24, 43, 0.96);
            box-shadow: 0 20px 70px #0008;
        }

        .logo {
            color: #55c5ff;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 29px;
        }

        .description {
            color: #a2b4cc;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            color: white;
            background: #080f1e;
            border: 1px solid #2c4562;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #55c5ff;
            box-shadow: 0 0 0 3px #55c5ff20;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            color: #06111e;
            background: linear-gradient(100deg, #4bb8ff, #83e7ff);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .note {
            color: #8295ae;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 20px;
        }

        #welcome {
            display: none;
            text-align: center;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            display: grid;
            place-items: center;
            margin: 0 auto 22px;
            border: 1px solid #36d8a0;
            border-radius: 50%;
            background: #36d8a018;
            color: #62f0bd;
            font-size: 38px;
        }

        #welcome h1 {
            color: #62f0bd;
            font-size: 26px;
        }

        #welcome p {
            color: #a2b4cc;
            line-height: 1.8;
        }

        .progress {
            height: 5px;
            margin-top: 25px;
            border-radius: 10px;
            background: #26364b;
            overflow: hidden;
        }

        #progressBar {
            width: 0;
            height: 100%;
            background: #55c5ff;
        }

        #progressBar.run {
            animation: loading 5s linear forwards;
        }

        @keyframes loading {
            to {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <section id="login">
            <div class="logo">PERIODIC</div>

            <h1>Chào mừng bạn!</h1>

            <p class="description">
                Nhập tên của bạn để bắt đầu khám phá thế giới hóa học cùng Periodic.
            </p>

            <form id="loginForm">
                <label for="username">Tên người dùng</label>

                <input
                    id="username"
                    type="text"
                    maxlength="40"
                    placeholder="Nhập tên của bạn"
                    autocomplete="off"
                    required
                >

                <button type="submit">Đăng nhập →</button>
            </form>

            <p class="note">
                Nhóm 4: Tống Gia Bảo - Ngô Anh Kiệt - Nguyễn Phúc Trung - Đồng Thị Lan Hương - Đinh Lê Trọng Cường
            </p>
        </section>

        <section id="welcome" aria-live="polite">
            <div class="success-icon">✓</div>

            <div class="logo">PERIODIC</div>

            <h1>Đăng nhập thành công!</h1>

            <p id="welcomeMessage"></p>

            <p>
                Đang chuyển đến trang chính sau
                <strong id="countdown">5</strong> giây...
            </p>

            <div class="progress">
                <div id="progressBar"></div>
            </div>
        </section>

    </main>

    <script>
        const form = document.getElementById("loginForm");
        const login = document.getElementById("login");
        const welcome = document.getElementById("welcome");
        const welcomeMessage = document.getElementById("welcomeMessage");
        const countdown = document.getElementById("countdown");
        const progressBar = document.getElementById("progressBar");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document
                .getElementById("username")
                .value.trim();

            if (!username) return;

            // Không lưu thông tin vào bộ nhớ trình duyệt.
            login.style.display = "none";
            welcome.style.display = "block";

            welcomeMessage.textContent =
                "Xin chào " + username +
                "! Chúc bạn học tập hiệu quả cùng Periodic.";

            progressBar.classList.add("run");

            let seconds = 5;

            const timer = setInterval(function() {
                seconds--;
                countdown.textContent = seconds;

                if (seconds <= 0) {
                    clearInterval(timer);

                    window.location.href =
                        "./preodicproject/preodic.website/preodic.html";
                }
            }, 1000);
        });
    </script>

</body>
</html>
