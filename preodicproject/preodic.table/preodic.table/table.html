<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <a href="../preodic.website/preodic.html" class="back-button">
    ← Trang chủ
    </a>
    <title>Bảng tuần hoàn hóa học</title>

    <link rel="stylesheet" href="table.css">
</head>

<body>

    <header>
        <h1>BẢNG TUẦN HOÀN HÓA HỌC</h1>
        <p>118 nguyên tố hóa học</p>
    </header>


    <!-- ============================= -->
    <!-- Ô THÔNG TIN NGUYÊN TỐ -->
    <!-- ============================= -->

    <section class="information">

        <div class="selected-element">
            <span id="info-number">--</span>
            <strong id="info-symbol">?</strong>
            <p id="info-name">Chọn một nguyên tố</p>
        </div>

        <div class="info-content">

            <h2 id="info-title">Thông tin nguyên tố</h2>

            <div class="info-grid">

                <p>
                    <b>Số hiệu nguyên tử:</b>
                    <span id="info-atomic-number">--</span>
                </p>

                <p>
                    <b>Nguyên tử khối:</b>
                    <span id="info-mass">--</span>
                </p>

                <p>
                    <b>Nhóm:</b>
                    <span id="info-group">--</span>
                </p>

                <p>
                    <b>Chu kỳ:</b>
                    <span id="info-period">--</span>
                </p>

                <p>
                    <b>Phân loại:</b>
                    <span id="info-category">--</span>
                </p>

            </div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- BẢNG TUẦN HOÀN -->
    <!-- ============================= -->

    <main>

        <div class="table-wrapper">

            <div id="periodic-table" class="periodic-table"></div>

        </div>

        <!-- Lanthanide + Actinide -->
        <div id="f-block" class="f-block"></div>

    </main>


    <footer>
        <p>Bảng tuần hoàn hóa học — 118 nguyên tố</p>
    </footer>


    <script src="table.js"></script>

</body>

</html>
