<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bài tập vận dụng</title>

    <link rel="stylesheet" href="test.css">
</head>

<body>

    <header class="header">
        <a href="../preodic.website/preodic.html" class="back-button">
            ← Trang chủ
        </a>

        <div class="header-title">
            <span>BÀI TẬP VẬN DỤNG</span>
            <h1>Kiểm tra kiến thức hóa học</h1>
        </div>
    </header>


    <section class="intro">
        <h2>Bài tập vận dụng</h2>

        <p>
            Hãy chọn đáp án phù hợp cho từng câu hỏi.
            Mỗi câu đúng được tính <strong>1 điểm</strong>.
        </p>
    </section>


    <main class="quiz-section">

        <div id="quiz">
            <div class="question-card loading">
                Đang tải câu hỏi...
            </div>
        </div>

        <button id="submit-button" class="submit-button">
            Nộp bài
        </button>

    </main>


    <section id="result-section" class="result-section">

        <h2>Kết quả</h2>

        <div id="score" class="score"></div>

        <div id="wrong-answers"></div>

    </section>


    <!-- MAMMOTH LOCAL -->
    <script src="./mammoth.browser.min.js"></script>

    <!-- CODE CỦA BẠN -->
    <script src="./test.js"></script>

</body>

</html>
